<section class="ops-panel timeline-panel" aria-labelledby="timeline-title">
  <div class="section-heading">
    <div>
      <p class="eyebrow">Today</p>
      <h2 id="timeline-title">Timeline</h2>
    </div>
  </div>

  {% if timeline %}
  <div class="timeline-track" aria-label="Current-day reset and anchor timeline">
    {% for entry in timeline %}
    <div
      class="timeline-item timeline-item--{{ entry.entry_class }}"
    >
      <span>{{ entry.time_label }}</span>
      <strong>{{ entry.account_name }}</strong>
      <small>{{ entry.label }}</small>
    </div>
    {% endfor %}
  </div>
  {% else %}
  <p class="empty-state">No anchors or resets are scheduled for today.</p>
  {% endif %}
</section>
