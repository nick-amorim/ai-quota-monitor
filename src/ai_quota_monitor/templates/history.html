{% extends "base.html" %}

{% block content %}
<section class="dashboard-shell history-shell" aria-labelledby="history-title">
  <header class="page-heading">
    <p class="eyebrow">Events</p>
    <h1 id="history-title">Event history</h1>
  </header>

  <form method="get" action="/history" class="filter-panel">
    <label>
      <span>Account</span>
      <select name="account_id">
        <option value="">All accounts</option>
        {% for account in accounts %}
        <option value="{{ account.id }}" {% if selected_account_id == account.id %}selected{% endif %}>
          {{ account_label(account) }}
        </option>
        {% endfor %}
      </select>
    </label>
    <label>
      <span>Level</span>
      <select name="level">
        <option value="">All levels</option>
        {% for level in levels %}
        <option value="{{ level }}" {% if selected_level == level %}selected{% endif %}>
          {{ level | title }}
        </option>
        {% endfor %}
      </select>
    </label>
    <label>
      <span>Category prefix</span>
      <input type="text" name="category" value="{{ selected_category or '' }}">
    </label>
    <button type="submit">Apply filters</button>
  </form>

  <section class="ops-panel history-panel" aria-labelledby="filtered-events-title">
    <div class="section-heading">
      <div>
        <p class="eyebrow">Filtered</p>
        <h2 id="filtered-events-title">Events</h2>
      </div>
      <a href="/" class="secondary-link">Dashboard</a>
    </div>

    {% include "_events_table.html" %}
  </section>
</section>
{% endblock %}
