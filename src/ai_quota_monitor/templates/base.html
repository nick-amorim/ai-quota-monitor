<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>{{ app_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
    <script src="{{ url_for('static', path='/app.js') }}" defer></script>
  </head>
  <body class="{{ body_class | default('') }}">
    <header class="appbar">
      <div class="appbar-inner">
        <a class="brand" href="/" aria-label="{{ app_name }} dashboard">
          <span class="brand-mark" aria-hidden="true">Q</span>
          <span class="brand-text">
            <span class="brand-title">{{ app_name }}</span>
            <span class="brand-sub">Codex quota monitor</span>
          </span>
        </a>

        <nav class="header-nav" aria-label="Primary">
          <a href="/">Dashboard</a>
          <a href="/monitor">Monitor</a>
          <a href="/history">History</a>
        </nav>

        <div class="appbar-actions">
          <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle theme" title="Toggle theme">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="17" height="17">
              <path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm0 2v14a7 7 0 0 1 0-14Z" fill="currentColor"></path>
            </svg>
          </button>
          {% block header_actions %}{% endblock %}
          <span class="version">v{{ version }}</span>
        </div>
      </div>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
