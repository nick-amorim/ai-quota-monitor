<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>{{ app_name }}</title>
    <script>
      (function () {
        try {
          var theme = window.localStorage.getItem("aiQuotaMonitorTheme") || "dark";
          document.documentElement.className = theme === "light" ? "light" : "dark";
        } catch (error) {
          document.documentElement.className = "dark";
        }
      })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}?v={{ static_asset_version() }}">
    <script src="{{ url_for('static', path='/app.js') }}?v={{ static_asset_version() }}" defer></script>
  </head>
  <body class="{{ body_class | default('') }}">
    <header class="appbar">
      <div class="appbar-inner">
        <a class="brand" href="/" aria-label="{{ app_name }} dashboard">
          <span class="brand-mark" aria-hidden="true">Q</span>
          <span class="brand-text">
            <span class="brand-title">{{ app_name }}</span>
            <span class="brand-sub">self-hosted &middot; v{{ version }}</span>
          </span>
        </a>

        <nav class="header-nav" aria-label="Primary">
          <a href="/" {% if request.url.path == "/" %}aria-current="page"{% endif %}>Dashboard</a>
          <a href="/history" {% if request.url.path.startswith("/history") %}aria-current="page"{% endif %}>Events</a>
          <a href="/monitor" {% if request.url.path.startswith("/monitor") %}aria-current="page"{% endif %}>Monitor</a>
        </nav>

        <div class="appbar-actions">
          <button class="icon-btn" type="button" data-theme-toggle aria-label="Switch to light theme" title="Switch to light theme" aria-pressed="true">
            <svg class="icon icon-sun" aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2"></path>
              <path d="M12 20v2"></path>
              <path d="m4.93 4.93 1.41 1.41"></path>
              <path d="m17.66 17.66 1.41 1.41"></path>
              <path d="M2 12h2"></path>
              <path d="M20 12h2"></path>
              <path d="m6.34 17.66-1.41 1.41"></path>
              <path d="m19.07 4.93-1.41 1.41"></path>
            </svg>
            <svg class="icon icon-moon" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M12 3a6.8 6.8 0 0 0 8.9 8.9A9 9 0 1 1 12 3Z"></path>
            </svg>
          </button>
          {% block header_actions %}{% endblock %}
        </div>
      </div>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
